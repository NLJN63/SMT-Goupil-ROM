
; Novell NE3200 last updated 1/5/1990

BOARD
	ID = "NVL0701"
	NAME = "Novell NE3200 Bus Master Ethernet"
	MFR = "NOVELL"
	CATEGORY = "NET"
	SLOT = EISA
	LENGTH = 330		;height = 100
	READID = YES
	BUSMASTER = 100
	HELP = "Novell NE3200 Board\n
		This configuration file initializes or\n
		allows selection of the following:\n
		1. Interrupt Selection(Selected Automatically) \n
		   (NONE, IRQ 5, 9, 10, 11, 15)\n
		   Interrupt Trigger Type (Level or Edge )\n
		2. Ethernet Media\n
		   (Cheapernet or Thick Ethernet)"

IOPORT(1) = 0Z800H
	INITVAL = LOC(7 6 4) 000

FUNCTION = "NE3200 Interrupt"

	CHOICE = "Disable Interrupts"
		SUBTYPE = "NOINT"
		DISABLE = YES
		FREE
			INIT = IOPORT(1) LOC(2-0) 000

	CHOICE = "Edge Triggered Interrupt"
		LINK
			IRQ = 5 | 9 | 10 | 11 | 15
			TRIGGER = EDGE
			INIT = IOPORT(1) LOC(2-0) 001-101
		FREE
			INIT = IOPORT(1) LOC(5) 1

	CHOICE = "Level Triggered Interrupt"
		LINK
			IRQ = 5 | 9 | 10 | 11 | 15
			TRIGGER = LEVEL
			INIT = IOPORT(1) LOC(2-0) 001-101
		FREE
			INIT = IOPORT(1) LOC(5) 0

FUNCTION = "NE3200 Connector Selected"

	CHOICE = "Cheapernet (BNC)"
		FREE
			INIT = IOPORT(1) LOC(3) 1

	CHOICE = "Ethernet (15 pin D)"
		FREE
			INIT = IOPORT(1) LOC(3) 0
