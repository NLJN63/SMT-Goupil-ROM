BOARD
  ID          = "DPT2402"
  NAME        = "DPT SCSI Host Bus Adapter (PM2012A/90)"
  MFR         = "DPT"
  CATEGORY    = "MSD"
  SLOT        = EISA
  LENGTH      = 341
  SKIRT       = NO
  READID      = YES
  BUSMASTER   = 999
  AMPERAGE    = 2900
  IOCHECK     = INVALID
  DISABLE     = SUPPORTED
  COMMENTS    = "\nThe Distributed Processing Technology PM2012A/90 is a high
                performance SCSI Host Bus Adapter with an EISA host interface.\n
                Key features of the adapter are:\n\n
                \t* 33MB/sec EISA transfer\n
                \t* EISA bus mastering\n
                \t* SCSI-2 compliant\n
                \t* 4MB/sec SCSI sync transfer\n
                \t* ISA hardware emulation\n
                \t* CAM-compliant EATA interface\n
                \t* Overlapped commands\n
                \t* Scatter/gather\n
                \t* Automatic request sense."
  HELP        = "For additional information, contact:\n\n
                \tDistributed Processing Technology\n
                \t132 Candace Drive\n
                \tMaitland, Florida  32751\n
                \t(407) 830-5522"


IOPORT(1)     = 0zC90h
IOPORT(2)     = 0zC84h
IOPORT(3)     = 0zC88h
  SIZE        = WORD
IOPORT(4)     = 0zC89h
IOPORT(5)     = 0zC8Ah
IOPORT(6)     = 0zC8Bh
IOPORT(7)     = 0zC8Ch
IOPORT(8)     = 0zC8Dh
IOPORT(9)     = 0zC8Eh
IOPORT(10)    = 0zC8Fh

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

JUMPER(1)     = 1
  NAME        = "Floppy Disable"
  JTYPE       = PAIRED
  LABEL       = LOC(1) "Y20"
  FACTORY     = LOC(1) 0
  VERTICAL    = YES
  REVERSE     = NO
  COMMENTS    = "Install jumper to DISABLE floppy."
  HELP        = "The Floppy Disable jumper is shipped from the factory removed,
                allowing floppy access."

JUMPER(2)     = 1
  NAME        = "BE3011 Enable"
  JTYPE       = PAIRED
  LABEL       = LOC(1) "Y7"
  FACTORY     = LOC(1) 0
  VERTICAL    = YES
  REVERSE     = NO
  COMMENTS    = "Install jumper to ENABLE BE3011 ROM."
  HELP        = "The BIOS Table Expander Enable jumper is shipped from the
                factory removed, not allowing BE3011 address decoding.  The
                BE3011 is a ROM containing 300 additional drive types and
                issues a controller selftest command at power-up."

JUMPER(3)     = 1
  NAME        = "BE3011 Address"
  JTYPE       = PAIRED
  LABEL       = LOC(1) "Y19"
  FACTORY     = LOC(1) 0
  VERTICAL    = YES
  REVERSE     = NO
  COMMENTS    = "Install jumper for alternate address."
  HELP        = "The BIOS Table Expander Address jumper is shipped from the
                factory removed, allowing the BE3011 to be decoded at address
                C8000h.  Installed, the BE3011 is decoded at D8000h."

JUMPER(4)     = 2
  NAME        = "RS-232 Connector"
  JTYPE       = INLINE
  LABEL       = LOC(1^2) "Y4"
  FACTORY     = LOC(1 2) 00
  VERTICAL    = NO
  REVERSE     = NO
  COMMENTS    = "Do not jumper these pins!"
  HELP        = "These pins are used for an RS-232 connector for factory debug
                of the PM2012.  Do not put jumpers on these pins."

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

GROUP         = "Hard Drive & SCSI Device"
TYPE          = "MSD,DSKCTL"

FUNCTION      = "SCSI and EISA Bus"
   COMMENTS   = "Always enable this function."
   HELP       = "This function must be enabled to allow access to the SCSI bus
                 and EISA Bus Master transfers."
   HELP       = "Always enable this function."
   CHOICE     = "Enabled"
   FREE
   INIT       = IOPORT(2) LOC(0) 1
   CHOICE     = "Disabled"
   DISABLE    = YES
   FREE
   INIT       = IOPORT(2) LOC(0) 0

FUNCTION      = "I/O Ports"
  COMMENTS    = "Select Primary to boot in ISA mode.\n
                 Select Secondary to disable."
  HELP        = "This function allows the controller I/O ports to to be used at
                 the Primary location, which is bootable with a standard BIOS,
                 or the Secondary location, which is commonly used as a DISABLE
                 location with slot-specific addressing."
  CONNECTION  = "Internal SCSI Connector, J10, Top Right\n
                 External SCSI Connector, J11, Middle Right"
  CHOICE      = "Primary (Bootable)"
    FREE
    PORT      = 1F0h
      SIZE    = WORD
    PORT      = 1F1h-1F7h
    INIT      = IOPORT(1) LOC(1) 0
    INIT      = IOPORT(4) LOC(7) 0
  CHOICE      = "Secondary"
    FREE
    PORT      = 170h
      SIZE    = WORD
    SHARE     = YES
    PORT      = 171h-177h
    SHARE     = YES
    INIT      = IOPORT(1) LOC(1) 1
    INIT      = IOPORT(4) LOC(7) 1

FUNCTION      = "Interrupt Number"
  COMMENTS    = "Select 14-Edge to boot in ISA mode.\n
                 Select 12-Level or 15-Level to share interrupts."
  HELP        = "This function allows the controller interrupt number to be
                 selected either at IRQ 14H, which is bootable with a standard
                 BIOS, or IRQ 12H or 15H.  These interrupts may also be chosen
                 as Edge (non-sharable) or Level (sharable)."
  CHOICE      = "14 - Edge (Bootable)"
    FREE
    IRQ       = 14
    TRIGGER   = EDGE
    INIT      = IOPORT(1) LOC(5 4 3) 100
    INIT      = IOPORT(1) LOC(0) 0
    INIT      = IOPORT(4) LOC(6) 0
    INIT      = IOPORT(5) LOC(6) 0
    INIT      = IOPORT(6) LOC(6) 1
    INIT      = IOPORT(7) LOC(6) 1
    INIT      = IOPORT(8) LOC(6) 1

  CHOICE      = "14 - Level"
    FREE
    IRQ       = 14
    TRIGGER   = LEVEL
    SHARE     = YES
    INIT      = IOPORT(1) LOC(5 4 3) 100
    INIT      = IOPORT(1) LOC(0) 1
    INIT      = IOPORT(4) LOC(6) 1
    INIT      = IOPORT(5) LOC(6) 0
    INIT      = IOPORT(6) LOC(6) 1
    INIT      = IOPORT(7) LOC(6) 1
    INIT      = IOPORT(8) LOC(6) 1

  CHOICE      = "15 - Edge"
    FREE
    IRQ       = 15
    TRIGGER   = EDGE
    INIT      = IOPORT(1) LOC(5 4 3) 010
    INIT      = IOPORT(1) LOC(0) 0
    INIT      = IOPORT(4) LOC(6) 0
    INIT      = IOPORT(5) LOC(6) 1
    INIT      = IOPORT(6) LOC(6) 1
    INIT      = IOPORT(7) LOC(6) 1
    INIT      = IOPORT(8) LOC(6) 1
  CHOICE      = "15 - Level"
    FREE
    IRQ       = 15
    TRIGGER   = LEVEL
    SHARE     = YES
    INIT      = IOPORT(1) LOC(5 4 3) 010
    INIT      = IOPORT(1) LOC(0) 1
    INIT      = IOPORT(4) LOC(6) 1
    INIT      = IOPORT(5) LOC(6) 1
    INIT      = IOPORT(6) LOC(6) 1
    INIT      = IOPORT(7) LOC(6) 1
    INIT      = IOPORT(8) LOC(6) 1
  CHOICE      = "12 - Edge"
    FREE
    IRQ       = 12
    TRIGGER   = EDGE
    INIT      = IOPORT(1) LOC(5 4 3) 001
    INIT      = IOPORT(1) LOC(0) 0
    INIT      = IOPORT(4) LOC(6) 0
    INIT      = IOPORT(5) LOC(6) 0
    INIT      = IOPORT(6) LOC(6) 0
    INIT      = IOPORT(7) LOC(6) 1
    INIT      = IOPORT(8) LOC(6) 1
  CHOICE      = "12 - Level"
    FREE
    IRQ       = 12
    TRIGGER   = LEVEL
    SHARE     = YES
    INIT      = IOPORT(1) LOC(5 4 3) 001
    INIT      = IOPORT(1) LOC(0) 1
    INIT      = IOPORT(4) LOC(6) 1
    INIT      = IOPORT(5) LOC(6) 0
    INIT      = IOPORT(6) LOC(6) 0
    INIT      = IOPORT(7) LOC(6) 1
    INIT      = IOPORT(8) LOC(6) 1
  CHOICE      = "Disabled"
    DISABLE   = YES
    FREE
    INIT      = IOPORT(1) LOC(5 4 3) 000

ENDGROUP

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

GROUP         = "Floppy Drive"
TYPE          = "MSD,FPYCTL"

FUNCTION      = "I/O Ports"
  COMMENTS    = "Select Primary to boot in ISA mode.\n
                 Install jumper Y20 to disable."
  HELP        = "The Primary and Secondary locations are automatically selected
                 during boot, but the Disable function is accomplished with
                 jumper Y20."
  CONNECTION  = "Floppy Connector, J8, Top Middle"
  CHOICE      = "Disabled"
    DISABLE   = YES
    FREE
    INIT      = JUMPER(1) LOC(1) 1
  CHOICE      = "Primary"
    FREE
    PORT      = 3F0h-3F7h
    INIT      = IOPORT(1) LOC(2) 0
    INIT      = JUMPER(1) LOC(1) 0
  CHOICE      = "Secondary"
    FREE
    PORT      = 370h-377h
    INIT      = IOPORT(1) LOC(2) 1
    INIT      = JUMPER(1) LOC(1) 0

ENDGROUP

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

GROUP         = "BIOS Table Expander ROM"
TYPE          = "OTH"

FUNCTION      = "Address"
  COMMENTS    = "Install jumper Y7 to enable the BE3011.\n
                 Install jumper Y19 to select the alternate D8000h address."
  HELP        = "The BE3011 is a ROM containing 300 additional drive types and
                 issues a controller selftest command at power-up."

  CHOICE      = "Disabled"
    DISABLE   = YES
    FREE
    INIT      = JUMPER(2) LOC(1) 0
  CHOICE      = "Enabled @ C8000h"
    FREE
    INIT      = JUMPER(3) LOC(1) 0
    INIT      = JUMPER(2) LOC(1) 1
    MEMORY    = 8K
    ADDRESS   = 0C8000h
    WRITABLE  = NO
    MEMTYPE   = OTH
    SIZE      = BYTE
    CACHE     = YES
  CHOICE      = "Enabled @ D8000h"
    FREE
    INIT      = JUMPER(3) LOC(1) 1
    INIT      = JUMPER(2) LOC(1) 1
    MEMORY    = 8K
    ADDRESS   = 0D8000h
    WRITABLE  = NO
    MEMTYPE   = OTH
    SIZE      = BYTE
    CACHE     = YES

ENDGROUP

