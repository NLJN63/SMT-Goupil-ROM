; DPT PM2012BX/9X EISA to SCSI Host Bus Adapter w/ Optional Cache
;                        Configuration File
;
;    Date     = 1/21/92
;    Version  = (See version at end of this file.)
;    Filename = !DPTA502.CFG
;

BOARD
  ID          = "DPTA502"
  NAME        = "DPT SCSI Host Bus Adapter (PM2012BX/9X)"
  MFR         = "DPT"
  CATEGORY    = "MSD"
  SLOT        = EISA
  LENGTH      = 341
  SKIRT       = NO
  READID      = YES
  BUSMASTER   = 999
  AMPERAGE    = 4500
  IOCHECK     = INVALID
  DISABLE     = SUPPORTED
  COMMENTS    = "\nThe Distributed Processing Technology PM2012BX/9X is a high
                performance SCSI Host Bus Adapter with an EISA host interface.\n
                Key features of the adapter are:\n\n
                \t* Up to 16MB of disk cache\n
                \t* 33MB/sec EISA transfer\n
                \t* EISA bus mastering\n
                \t* SCSI-2 and CCS compliant\n
                \t* 10MB/sec SCSI sync transfer\n
                \t* WD1003 hardware emulation\n
                \t* CAM-compliant EATA interface\n
                \t* Overlapped commands\n
                \t* Scatter/gather\n
                \t* Automatic request sense\n
                \t* RAID Support"
  HELP        = "For additional information, contact:\n\n
                \tDistributed Processing Technology\n
                \t140 Candace Drive\n
                \tMaitland, Florida  32751\n
                \t(407) 830-5522"


IOPORT(1)     = 0zC90h
IOPORT(2)     = 0zC84h
IOPORT(3)     = 0zC88h
  SIZE        = WORD
IOPORT(4)     = 0zC89h
IOPORT(5)     = 0zC8Ah
IOPORT(6)     = 0zC8Bh
IOPORT(7)     = 0zC8Ch
IOPORT(8)     = 0zC8Dh
IOPORT(9)     = 0zC8Eh
IOPORT(10)    = 0zC8Fh
IOPORT(11)    = 0zC94h

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

JUMPER(2)     = 1
  NAME        = "Option ROM Size"
  JTYPE       = PAIRED
  LABEL       = LOC(1) "Y19"
  FACTORY     = LOC(1) 0
  VERTICAL    = YES
  REVERSE     = NO
  COMMENTS    = "Install jumper for 32K (27256) type ROM"
  HELP        = "The DPT Controller currently supports only the 2764 size
                 ROM.  Therefore, do not install this jumper."

JUMPER(4)     = 2
  NAME        = "Factory Use Only"
  JTYPE       = INLINE
  LABEL       = LOC(1^2) "Y4"
  FACTORY     = LOC(1 2) 00
  VERTICAL    = NO
  REVERSE     = NO
  COMMENTS    = "Do not jumper these pins!"
  HELP        = "These pins are used for an RS-232 connector for factory debug
                of the PM2012.  Do not put jumpers on these pins."

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

GROUP         = "Hard Drive & SCSI Device"
TYPE          = "MSD,DSKCTL"

FUNCTION      = "SCSI and EISA Bus"
   COMMENTS   = "Always enable this function."
   HELP       = "This function must be enabled to allow access to the SCSI bus
                 and EISA Bus Master transfers."
   CHOICE     = "Enabled"
   FREE
   INIT       = IOPORT(2) LOC(0) 1
   CHOICE     = "Disabled"
   DISABLE    = YES
   FREE
   INIT       = IOPORT(2) LOC(0) 0

FUNCTION      = "I/O Ports"
  COMMENTS    = "Select Primary to boot in WD1003 mode.\n
                 Select Secondary to disable."
  HELP        = "This function allows the controller I/O ports to to be used at
                 the Primary location, which is bootable with a standard BIOS,
                 or the Secondary location, which is commonly used as a DISABLE
                 location with slot-specific addressing."
  CONNECTION  = "Internal SCSI Connector, J10, Top Right\n
                 External SCSI Connector, J11, Middle Right"
  CHOICE      = "Primary (Bootable)"
    FREE
    PORT      = 1F0h
      SIZE    = WORD
    PORT      = 1F1h-1F7h
    INIT      = IOPORT(1) LOC(1) 0
    INIT      = IOPORT(1) LOC(0) 0
    INIT      = IOPORT(4) LOC(7) 0
  CHOICE      = "Secondary/Disabled"
    FREE
    PORT      = 170h
      SIZE    = WORD
    SHARE     = YES
    PORT      = 171h-177h
    SHARE     = YES
    INIT      = IOPORT(1) LOC(1) 1
    INIT      = IOPORT(1) LOC(0) 0
    INIT      = IOPORT(4) LOC(7) 1

FUNCTION      = "Interrupt Number"
  COMMENTS    = "Select 14-Edge to boot in WD1003 mode.\n
                 Select 11-Level or 15-Level to share interrupts."
  HELP        = "This function allows the controller interrupt number to be
                 selected either at IRQ 14H, which is bootable with a standard
                 BIOS, or IRQ 11H or 15H.  These interrupts may also be chosen
                 as Edge (non-sharable) or Level (sharable)."
  CHOICE      = "14 - Edge (Bootable)"
    FREE
    IRQ       = 14
    TRIGGER   = EDGE
    INIT      = IOPORT(1) LOC(5 4 3) 100
    INIT      = IOPORT(1) LOC(2) 0
    INIT      = IOPORT(4) LOC(6) 0
    INIT      = IOPORT(5) LOC(6) 0
    INIT      = IOPORT(6) LOC(6) 1
    INIT      = IOPORT(7) LOC(6) 1
    INIT      = IOPORT(8) LOC(6) 1

  CHOICE      = "11 - Level"
    FREE
    IRQ       = 11
    TRIGGER   = LEVEL
    SHARE     = YES
    INIT      = IOPORT(1) LOC(5 4 3) 001
    INIT      = IOPORT(1) LOC(2) 1
    INIT      = IOPORT(4) LOC(6) 1
    INIT      = IOPORT(5) LOC(6) 1
    INIT      = IOPORT(6) LOC(6) 1
    INIT      = IOPORT(7) LOC(6) 0
    INIT      = IOPORT(8) LOC(6) 1

  CHOICE      = "11 - Edge"
    FREE
    IRQ       = 11
    TRIGGER   = EDGE
    INIT      = IOPORT(1) LOC(5 4 3) 001
    INIT      = IOPORT(1) LOC(2) 0
    INIT      = IOPORT(4) LOC(6) 0
    INIT      = IOPORT(5) LOC(6) 1
    INIT      = IOPORT(6) LOC(6) 1
    INIT      = IOPORT(7) LOC(6) 0
    INIT      = IOPORT(8) LOC(6) 1

  CHOICE      = "14 - Level"
    FREE
    IRQ       = 14
    TRIGGER   = LEVEL
    SHARE     = YES
    INIT      = IOPORT(1) LOC(5 4 3) 100
    INIT      = IOPORT(1) LOC(2) 1
    INIT      = IOPORT(4) LOC(6) 1
    INIT      = IOPORT(5) LOC(6) 0
    INIT      = IOPORT(6) LOC(6) 1
    INIT      = IOPORT(7) LOC(6) 1
    INIT      = IOPORT(8) LOC(6) 1

  CHOICE      = "15 - Edge"
    FREE
    IRQ       = 15
    TRIGGER   = EDGE
    INIT      = IOPORT(1) LOC(5 4 3) 010
    INIT      = IOPORT(1) LOC(2) 0
    INIT      = IOPORT(4) LOC(6) 0
    INIT      = IOPORT(5) LOC(6) 1
    INIT      = IOPORT(6) LOC(6) 1
    INIT      = IOPORT(7) LOC(6) 1
    INIT      = IOPORT(8) LOC(6) 1

  CHOICE      = "15 - Level"
    FREE
    IRQ       = 15
    TRIGGER   = LEVEL
    SHARE     = YES
    INIT      = IOPORT(1) LOC(5 4 3) 010
    INIT      = IOPORT(1) LOC(2) 1
    INIT      = IOPORT(4) LOC(6) 1
    INIT      = IOPORT(5) LOC(6) 1
    INIT      = IOPORT(6) LOC(6) 1
    INIT      = IOPORT(7) LOC(6) 1
    INIT      = IOPORT(8) LOC(6) 1
  CHOICE      = "Disabled"
    DISABLE   = YES
    FREE
    INIT      = IOPORT(1) LOC(5 4 3) 000

ENDGROUP

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

GROUP         = "Option ROM"
TYPE          = "OTH"

FUNCTION      = "Address"
  COMMENTS    = "Select C8000 or D8000 to allow the BIOS to see the
                 onboard ROM."
  HELP        = "This ROM is normally the BR401X SmartROM, an INT13
                 replacement BIOS."
  CHOICE      = "Enabled @ C8000h"
    FREE
    INIT      = IOPORT(11) LOC(1) 1
    INIT      = IOPORT(11) LOC(2) 0
    MEMORY    = 8K
    ADDRESS   = 0C8000h
    WRITABLE  = NO
    MEMTYPE   = OTH
    SIZE      = BYTE
    CACHE     = YES
  CHOICE      = "Disabled"
;   DISABLE   = YES
    FREE
    INIT      = IOPORT(11) LOC(1) 0
  CHOICE      = "Enabled @ D8000h"
    FREE
    INIT      = IOPORT(11) LOC(1) 1
    INIT      = IOPORT(11) LOC(2) 1
    MEMORY    = 8K
    ADDRESS   = 0D8000h
    WRITABLE  = NO
    MEMTYPE   = OTH
    SIZE      = BYTE
    CACHE     = YES

ENDGROUP

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

GROUP         = "Host Bus Adapter"

FUNCTION      = "SCSI ID"
   COMMENTS   = "Select a SCSI ID for the host bus adapter which is not
                 currently used by any other SCSI device."
   HELP       = "The controller must have a unique SCSI ID if more than one
                 adapter or SCSI device is attached."
   CHOICE     = "7"
   FREE
   INIT       = IOPORT(4) LOC(5-3) 111
   CHOICE     = "0"
   FREE
   INIT       = IOPORT(4) LOC(5-3) 000
   CHOICE     = "1"
   FREE
   INIT       = IOPORT(4) LOC(5-3) 001
   CHOICE     = "2"
   FREE
   INIT       = IOPORT(4) LOC(5-3) 010
   CHOICE     = "3"
   FREE
   INIT       = IOPORT(4) LOC(5-3) 011
   CHOICE     = "4"
   FREE
   INIT       = IOPORT(4) LOC(5-3) 100
   CHOICE     = "5"
   FREE
   INIT       = IOPORT(4) LOC(5-3) 101
   CHOICE     = "6"
   FREE
   INIT       = IOPORT(4) LOC(5-3) 110

ENDGROUP

