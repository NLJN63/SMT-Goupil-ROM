;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

GROUP         = "Controller Parameters"

FUNCTION      = "SCSI Parameters"

SUBFUNCTION   = "Maximum Transfer Rate"
   COMMENTS   = "Select the maximum SCSI transfer rate for all drives on the
                 controller.  This rate will apply to the Internal and External
                 SCSI connector."
   CHOICE     = "10MB/s"
   FREE
   INIT       = IOPORT(8) LOC(4-3) 00
   CHOICE     = "8MB/s"
   FREE
   INIT       = IOPORT(8) LOC(4-3) 01
   CHOICE     = "5MB/s"
   FREE
   INIT       = IOPORT(8) LOC(4-3) 10
   CHOICE     = "Asynchronous"
   FREE
   INIT       = IOPORT(8) LOC(4-3) 11

SUBFUNCTION   = "External Cable Detection"
   COMMENTS   = "Select Yes for the controller to check for an external SCSI
                 cable,  whose presence will force all SCSI transfers,
                 internal and external, to 5MB/s.  Some hard drives are
                 unreliable at 10MB/s on external SCSI cables."
   CHOICE     = "Yes - 5MB/s"
   FREE
   INIT       = IOPORT(8) LOC(5) 0
   CHOICE     = "No - 10MB/s"
   FREE
   INIT       = IOPORT(8) LOC(5) 1

SUBFUNCTION   = "Read/Write Timeout"
   COMMENTS   = "Enabled, the controller will timeout on all Read and Write
                 commands that are active for more than 5 seconds.  Timeouts
                 are only performed on caching controllers.  The controller
                 will reset the SCSI bus and retry the command.  Timeouts
                 should be enabled on all controllers with the DM401X Disk
                 Mirroring Module."
   CHOICE     = "Enabled - 5 sec"
   FREE
   INIT       = IOPORT(8) LOC(2) 0
   CHOICE     = "Disabled"
   FREE
   INIT       = IOPORT(8) LOC(2) 1

FUNCTION      = "Cache Parameters"

SUBFUNCTION   = "Cache"
   CHOICE     = "Enabled (Write-Back)"
   FREE
   INIT       = IOPORT(7) LOC(7) 0
   INIT       = IOPORT(8) LOC(7) 0
   CHOICE     = "Enabled (Write-Through)"
   FREE
   INIT       = IOPORT(7) LOC(7) 0
   INIT       = IOPORT(8) LOC(7) 1
   CHOICE     = "Disabled"
   FREE
   INIT       = IOPORT(7) LOC(7) 1
   INIT       = IOPORT(8) LOC(7) 1

SUBFUNCTION   = "Max. Percentage Dirty"
   CHOICE     = "50%"
   FREE
   INIT       = IOPORT(7) LOC(0) 0
   CHOICE     = "80%"
   FREE
   INIT       = IOPORT(7) LOC(0) 1

SUBFUNCTION   = "Max. Percentage Look-Ahead"
   CHOICE     = "30%"
   FREE
   INIT       = IOPORT(7) LOC(1) 0
   CHOICE     = "80%"
   FREE
   INIT       = IOPORT(7) LOC(1) 1

SUBFUNCTION   = "Look-Ahead Length"
   CHOICE     = "8 blocks"
   FREE
   INIT       = IOPORT(7) LOC(2) 0
   CHOICE     = "Disabled"
   FREE
   INIT       = IOPORT(7) LOC(2) 1

SUBFUNCTION   = "Cache Threshold"
   CHOICE     = "16 blocks"
   FREE
   INIT       = IOPORT(7) LOC(3) 0
   CHOICE     = "65535 blocks"
   FREE
   INIT       = IOPORT(7) LOC(3) 1

ENDGROUP

