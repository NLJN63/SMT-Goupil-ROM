JUMPER(5) = 1
  NAME = "CGA/MDA"
  JTYPE = PAIRED
  LABEL = LOC(1) "E20"
  COMMENTS = "Si pr‚sent, ce cavalier assure la compatibilit‚ au
  niveau du contr“leur clavier pour l'affichage CGA."

JUMPER(6) = 1
  NAME  = "ROM-BIOS VGA de la carte mŠre"
  JTYPE = PAIRED
  LABEL = LOC(1) "E21"
  COMMENTS = " Ce cavalier doit ˆtre mis pour valider le ROM-BIOS
  VGA pr‚sent sur la carte mŠre lorqu'une carte GVGA (Goupil VGA) est
  utilis‚e.  Une telle carte ne contient pas de ROM-BIOS et doit ˆtre
  pilot‚e par le ROM-BIOS VGA de la carte mŠre.  A noter que ce ROM-BIOS
  est con‡u pour piloter des cartes de la famille GVGA et il doit ˆtre
  invalid‚ si une autre carte VGA (ayant son propre ROM-BIOS) est 
  utilis‚e.  Si valid‚, le ROM-BIOS VGA int‚gr‚ occupe 32K octets
  en 0C0000h."
  
;----------------------------------------------------------------------------
; Functions 
;----------------------------------------------------------------------------

FUNCTION = "Ports de communication int‚gr‚s"
  TYPE = "COM"
  SUBFUNCTION = "Port s‚rie COM1"
    TYPE = "COM1"
    CHOICE = "Valid‚"
      SUBTYPE = "ENA"
      LINK
        IRQ = 4
      	PORT = 03F8h-03FFh
        INIT = JUMPER(2) LOC(1) 1

    CHOICE = "Invalid‚"
      SUBTYPE = "DIS"
      LINK
        INIT = JUMPER(2) LOC(1) 0

  SUBFUNCTION = "Port s‚rie COM2"
    TYPE = "COM2"
    CHOICE = "Valid‚"
      SUBTYPE = "ENA"
      LINK
      	IRQ = 3
      	PORT = 02F8h-02FFh
        INIT = JUMPER(1) LOC(1) 1

    CHOICE = "Invalid‚"
      SUBTYPE = "DIS"
      LINK
        INIT = JUMPER(1) LOC(1) 0

  SUBFUNCTION = "Port parallŠle LPT1"
    TYPE = "LPT1"
    CHOICE = "Valid‚"
      SUBTYPE = "ENA"
      LINK
        IRQ = 7
        PORT = 03BCh-03BFh
        INIT = JUMPER(4) LOC(1) 1

    CHOICE = "Invalid‚"
      SUBTYPE = "DIS"
      LINK
        INIT = JUMPER(4) LOC(1) 0

FUNCTION = "Contr“leur de floppy int‚gr‚"
  TYPE = ""
    CHOICE = "Valid‚"
    SUBTYPE = "ENA"
     LINK
      IRQ = 6
        SHARE = YES
        TRIGGER = EDGE
      PORT = 03F6h
        SHARE = YES
      PORT = 03F0h-03F5h
      PORT = 03F7h
      INIT = JUMPER(3) LOC(1) 1

    CHOICE = "Invalid‚"
    SUBTYPE = "DIS"
    LINK
      INIT = JUMPER(3) LOC(1) 0

FUNCTION = "ROM-BIOS VGA int‚gr‚"
  TYPE = "GVGA"
  COMMENTS = "Le ROM-BIOS VGA int‚gr‚ doit ˆtre valid‚ lorsqu'une carte
  GVGA (Goupil VGA) est utilis‚e car cette carte ne contient pas de
  ROM-BIOS.  Si une autre carte VGA est utilis‚e (ayant son propre
  ROM-BIOS), le ROM-BIOS VGA int‚gr‚ doit ˆtre invalid‚ afin d'‚viter
  un conflit.  Le ROM-BIOS VGA int‚gr‚ occupe 32K octets en 0C0000h.
  La combinaison ROM-BIOS VGA int‚gr‚/carte GVGA peut ‚muler un
  contr“leur d'affichage CGA ou Hercule.  Il n'est cependant pas
  pr‚vu pour utiliser deux cartes d'affichage … la fois (voir le
  manuel utilisateur du systŠme d'exploitation pour plus de d‚tails)."

  CHOICE = "Valid‚"
    SUBTYPE = "ENA"
    LINK
      MEMORY = 32K
        ADDRESS = 0C0000h
      INIT = JUMPER(6) LOC(1) 1

;To reserve resources for GVGA card, in case user does not insert it right away
    SUBCHOICE
      LINK
        PORT=03B0h-03BBh
      LINK
        PORT=03C0h-03CFh
      LINK
        PORT=03D0h-03DFh
      LINK
        PORT=46E8h
      LINK
        MEMORY=128K
        ADDRESS=0A0000h
        MEMTYPE=OTH
        CACHE = NO
    SUBCHOICE

  CHOICE = "Invalid‚"
    SUBTYPE = "DIS"
    LINK
      INIT = JUMPER(6) LOC(1) 0


FUNCTION = "Compatibility clavier MDA/CGA"
  COMMENTS = "Compatibilit‚ au niveau du contr“leur clavier
  pour l'affichage CGA."

  CHOICE = "CGA"
    LINK
      INIT = JUMPER(5) LOC(1) 1
  CHOICE = "MDA"
    LINK
      INIT = JUMPER(5) LOC(1) 0


FUNCTION = "M‚moire systŠme"
  SHOW = NO

  CHOICE = ""
    COMBINE
      MEMORY = 640K
        ADDRESS = 0
    COMBINE
      MEMORY = 7M
        ADDRESS = 1M
