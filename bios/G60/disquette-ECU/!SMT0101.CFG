;----------------------------------------------------------------------------
; Initializations
;----------------------------------------------------------------------------

JUMPER(1) = 1
  NAME = "COM2 de la carte mŠre"
  JTYPE = PAIRED
  LABEL = LOC(1) "E3"
  COMMENTS = "Si pr‚sent, ce cavalier valide le port de communication
  s‚rie integr‚ COM2 sur l'IRQ 3, sinon ce port de communication int‚gr‚
  est d‚valid‚ et l'IRQ 3 rendue libre pour une autre utilisation."

JUMPER(2) = 1
  NAME = "COM1 de la carte mŠre"
  JTYPE = PAIRED
  LABEL = LOC(1) "E4"
  COMMENTS = "Si pr‚sent, ce cavalier valide le port de communication
  s‚rie integr‚ COM1 sur l'IRQ 4, sinon ce port de communication int‚gr‚
  est d‚valid‚ et l'IRQ 4 rendue libre pour une autre utilisation."


JUMPER(3) = 1
  NAME = "Contr“leur floppy int‚gr‚"
  JTYPE = PAIRED
  LABEL = LOC(1) "E6"
  COMMENTS = "Si pr‚sent, ce cavalier valide le contr“leur de floppy
  integr‚ sur l'IRQ 6, sinon ce contr“leur de floppy int‚gr‚
  est d‚valid‚ et l'IRQ 6 rendue libre pour une autre utilisation."


JUMPER(4) = 1
  NAME = "LPT1 de la carte mŠre"
  JTYPE = PAIRED
  LABEL = LOC(1) "E7"
  COMMENTS = "Si pr‚sent, ce cavalier valide le port parallŠle
  integr‚ LPT1 sur l'IRQ 7, sinon ce port parallŠle int‚gr‚
