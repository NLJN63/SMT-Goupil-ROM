BOARD
  ID =       "SMT0101"
  NAME =     "G60 Carte SystŠme"
  MFR =      "SMT Goupil"
  CATEGORY = "SYS"
  SLOT =     EMB(0)
  READID = YES
  COMMENTS = "Le G60 est un micro ordinateur EISA ‚quip‚ d'un
  processeur i496"

SYSTEM
  NONVOLATILE = 8128
  AMPERAGE = 20000

  SLOT(1) = EISA
  SLOT(2) = EISA
  SLOT(3) = EISA
  SLOT(4) = EISA
  SLOT(5) = EISA
  SLOT(6) = EISA
  SLOT(7) = ISA8
  SLOT(8) = ISA8

  MEMORY = 640K  ADDRESS =      0h CACHE = YES STEP = 128K
