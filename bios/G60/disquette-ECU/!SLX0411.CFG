BOARD
	ID = "SLX0411"
	NAME = "Contr“leur SI EISA intelligent"
	MFR = "Specialix"
	CATEGORY = "COM"
	SLOT = EISA
	READID = YES
	IOCHECK = INVALID
	DISABLE = SUPPORTED
	COMMENTS = "Le contr“leur E/S s‚rie SI EISA offre jusqu'… 32 ports
  de communication asynchrones."

	HELP = "Le contr“leur E/S s‚rie SI EISA se configure entiŠrement 
    automatiquement.  Il peut s'adresser … n'importe qu'elle frontiŠre
    de 64K octets dans les premiers 2G octets de l'espace adresse
    .\nLes lignes d'interruption suivantes sont possible: 3, 4, 5,
    6, 7, 9, 10, 11, 12, 14, 15."
    
IOPORT(1) = 0ZC00h
	SIZE = WORD
	INITVAL = xxxxxxxxxxxxxxxxb		; Address selection register
IOPORT(2) = 0ZC02h
	SIZE = BYTE
	INITVAL = xxxx0000b			      ; IRQ selection register

FUNCTION = "Ligne d'interruption"
	COMMENTS = "L'utilisation d'une ligne d'interruption peut ˆtre
  activ‚e ou d‚sactiv‚e.  Si activ‚e, l'utilitaire de configuration
  choisira une IRQ appropri‚e.  Il est cependant possible de forcer
  manuellement l'IRQ utilis‚e."

	CHOICE = "Choix de: 3, 4, 5, 6, 7, 9, 10, 11, 12, 14, 15"
	FREE
		IRQ = 3 | 4 | 5 | 6 | 7 | 9 | 10 | 11 | 12 | 14 | 15
		SHARE = YES
		TRIGGER = LEVEL
		INIT = IOPORT(2) LOC (7 6 5 4) 0011b | 0100b | 0101b | 0110b | 0111b | 1001b | 1010b | 1011b | 1100b | 1110b | 1111b 
	CHOICE = "Aucune"
	FREE
		INIT = IOPORT(2) LOC (7 6 5 4) 0000b

FUNCTION = "Espace adresse"
	COMMENTS = "La carte SI EISA utilise 64K octets d'espace adresse sur une
  frontiŠre de 64K octets.  L'utilitaire de configuration choisira
  une adresse appropri‚e.  Il est cependant possible de forcer manuellement
  une autre adresse."
  
	CHOICE = "Valid"
	COMBINE
		MEMORY = 64K

; As COMPAQ EISA machines use the A31 address line as chip select for the
; Weitek FPU, addresses above 2 gigabytes are not available for the SI card.
; To use the full 4 gigabyte address space of the 386 / 486 replace the
; ADDRESS and INIT fields below by the corresponding comment at the end of
; each line.

		ADDRESS = 0A0000h - 07F0000h STEP = 64K
		WRITABLE = YES
		MEMTYPE = OTH
		SIZE = WORD
		CACHE = NO
		INIT = IOPORT(1) 0000000000001010  - 0000000001111111
	
	
