                 as WD1003 drive 0 (C:).\n
                 Select Disabled for no drive 0 emulation."
   HELP       = "The SCSI ID should be unique and the LUN is normally set to
                 0 on SCSI drives, but may be set to other than 0 on SCSI
                 bridge controllers."

