;----------------------------------------------------------------------------
; Kortex modem
;----------------------------------------------------------------------------
BOARD
  ID =       "KTX0101"
  NAME =     "Carte modem"
  MFR =      "Kortex"
  CATEGORY = "COM"
  READID =   NO
  SLOT =     ISA8

JUMPER(1) = 4
  NAME = "Port s‚rie utilis‚"
  JTYPE = PAIRED


JUMPER(2) = 2
  NAME = "Ligne d'interruption utilis‚e"
  JTYPE = INLINE
  LABEL = LOC(1^2 2^3) "COM 2,3,4" "COM 1"
  REVERSE = YES

FUNCTION = "Port s‚rie/IRQ combinaison"
  TYPE = "COM"
  CHOICE = "COM2/IRQ 3"
    LINK
      IRQ  = 3
    	PORT = 02F8h-02FFh
      INIT = JUMPER(1) LOC (1-4) 0100
      INIT = JUMPER(2) LOC(1^2 2^3) 10

  CHOICE = "COM1/IRQ 4"
    LINK
      IRQ  = 4
    	PORT = 03F8h-03FFh
      INIT = JUMPER(1) LOC (1-4) 1000
      INIT = JUMPER(2) LOC(1^2 2^3) 01

  CHOICE = "COM3/IRQ 3"
    LINK
      IRQ  = 3
    	PORT = 0370h-0374h
      INIT = JUMPER(1) LOC (1-4) 0010
      INIT = JUMPER(2) LOC(1^2 2^3) 10

  CHOICE = "COM4/ IRQ 3"
    LINK
      IRQ  = 3
    	PORT = 0270h-0274h
      INIT = JUMPER(1) LOC (1-4) 0001
      INIT = JUMPER(2) LOC(1^2 2^3) 10
