;AST Desktop EISA System Board Configuration File
;!AST0081.CFG
;Version 2.01    Dec 3, 1991

BOARD
  ID = "AST0081"
  NAME = "AST Premium EISA System Board"
  MFR = "AST"
  CATEGORY = "SYS"
  SLOT = EMB( 0 )
  READID = YES
  COMMENTS = "System Board for AST Premium EISA Computers"

  HELP = "This .CFG file enables you to set system board options,
	such as parallel and serial ports, floppy and hard-disk drive
	types, and the primary video display.  To set other 
	system options such as Time and Date, run ASTSETUP."

SYSTEM
  NONVOLATILE = 8192
  SLOT( 1 ) = EISA
  SLOT( 2 ) = EISA,"P-BUS"
  SLOT( 3 ) = EISA,"P-BUS"
  SLOT( 4 ) = EISA,"P-BUS"
  SLOT( 5 ) = EISA
  SLOT( 6 ) = EISA
  SLOT( 7 ) = EISA
   BUSMASTER = NO

INCLUDE = "!AST8100.CFG"
INCLUDE = "ASTOVL.OVL"

FUNCTION = "System ROM BIOS"
  SHOW = NO
  CHOICE = "ROM BIOS"
    LINK
    MEMORY = 64K
    ADDRESS = 0F0000H
    WRITABLE = NO
    MEMTYPE = OTH
    CACHE = YES
FUNCTION = "System Resources"
  SHOW=NO
  CHOICE = "System"
    LINK
    IRQ = 0
    IRQ = 1
    IRQ = 8
    IRQ = 12
    IRQ = 13
     SHARE = YES
