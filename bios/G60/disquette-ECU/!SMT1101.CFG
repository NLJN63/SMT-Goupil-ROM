BOARD
  ID        = "SMT1101"
  NAME      = "Contr“leur disque EISA"
  MFR       = "SMT-Goupil"
  CATEGORY  = "MSD"
  SLOT      = EISA
  LENGTH    = 330
  READID    = YES
  AMPERAGE  = 5000
  BUSMASTER = 32
  IOCHECK   = VALID
  DISABLE   = SUPPORTED

IOPORT(1) = 0zCC0h
 
FUNCTION = "Interface standard"
  TYPE = "MSD,DSKCTL;SHDI"
  COMMENTS = "Le contr“leur de disque dur EISA peut ˆtre configur‚
  pour se comporter comme un contr“leur ISA.\nL'interface standard
  ISA peut donc ˆtre install‚e en Primaire ou en Secondaire,
  ou bien peut ˆtre d‚valid‚e.  Si elle valid‚e (Primaire ou Secondaire),
  elle utilise l'interruption standard du disque dur (IRQ 14
  sur front).\nCette interface peut ˆtre valid‚e en mˆme temps que
  l'interface \"Bus Master\"."
  CHOICE = "Primaire"
    SUBTYPE="1F0"
    FREE
      IRQ = 14
        SHARE = no
	TRIGGER = edge
      PORT = 01F0h-01F7h
        SHARE = no
      PORT = 03F6h
        SHARE = YES
      PORT = 11F1h
        SHARE = no
      INIT = IOPORT(1) LOC (1 0) 01
      INIT = PORTADR(11F1h) 00000100
      INIT = PORTADR(04D1h) byte r0rrrrrr
  CHOICE = "Secondaire"
    SUBTYPE="170"
    FREE
      IRQ = 15
        SHARE = no
	TRIGGER = edge
      PORT = 0170h-0177h
        SHARE = no
      PORT = 0376h
        SHARE = yes
      PORT = 1171h
        SHARE = no
      INIT = IOPORT(1) LOC (1 0) 11
      INIT = PORTADR(1171h) byte 00001000
      INIT = PORTADR(04D1h) byte r0rrrrrr
  CHOICE = "Invalid‚e"
    FREE
      INIT = IOPORT(1) LOC (1 0) 00

FUNCTION = "Interface Bus Master"
  TYPE = "MSD,DSKCTL;BMIC"
  COMMENTS = "L'interface \"Bus Master\" ne peut ˆtre utilis‚e
  qu'avec des drivers con‡us sp‚cialement pour cette carte.  Elle
  est automatiquement valid‚e (mˆme si non utilis‚e) et ne pr‚sente
  pas de conflits avec l'interface standard."

  SUBFUNCTION = "Ligne d'interruption Bus Master"
    TYPE = "BMINT"
    COMMENTS = "Cette option permet de selectionner la ligne 
    d'interruption qui sera utilis‚e par le driver \"Bus Master\"
    .  Cette ligne d'interruption ‚tant configur‚e pour fonctionner
    sur niveau, elle peut ˆtre partag‚e avec d'autres dispositifs
    (a condition qu'eux aussi sachent travailler sur niveau)."

    CHOICE = "Aucune"
      FREE
        INIT = IOPORT(1) LOC (7-2) 000001
    CHOICE = "IRQ 15 - D‚clenchement sur niveau"
      FREE
        IRQ = 15
          SHARE = YES
          TRIGGER = LEVEL
        INIT = IOPORT(1) LOC (7-2) 100000
        INIT = PORTADR(04D1h) byte 1rrrrrrr
    CHOICE = "IRQ 14 - D‚clenchement sur niveau"
      FREE
        IRQ = 14
          SHARE = YES
          TRIGGER = LEVEL
        INIT = IOPORT(1) LOC (7-0) 01000000	; also disable SI
        INIT = PORTADR(04D1h) byte r1rrrrrr
    CHOICE = "IRQ 11 - D‚clenchement sur niveau"
      FREE
        IRQ = 11
          SHARE = YES
          TRIGGER = LEVEL
        INIT = IOPORT(1) LOC (7-2) 000100
        INIT = PORTADR(04D1h) byte rrrr1rrr
    CHOICE = "IRQ 10 - D‚clenchement sur niveau"
      FREE
        IRQ = 10
          SHARE = YES
          TRIGGER = LEVEL
        INIT = IOPORT(1) LOC (7 6 5 4 3 2) 001000
        INIT = PORTADR(04D1h) byte rrrrr1rr
