

BOARD
	ID="ADP0000"
	NAME="Adaptec 32-bit EISA SCSI Host Adapter"
	MFR="ADAPTEC, Inc."
	CATEGORY="MSD"
	SLOT=EISA
	LENGTH=330
	AMPERAGE=2500
	SKIRT=NO
	READID=YES
	BUSMASTER=50
	IOCHECK=VALID
	DISABLE=SUPPORTED
	COMMENTS="AHA-1740 Configuration File Version 1.00"

IOPORT(1)=0zcc0h			;Group 1 port address
	INITVAL = XX000XXX					
IOPORT(2)=0zcc1h			;BIOS address
	INITVAL = 1100XXXX
IOPORT(3)=0zcc2h			;Interrupt definition
	INITVAL = 000XXXXX
IOPORT(4)=0zcc3h			;SCSI definition
	INITVAL = 000XXXXX
IOPORT(5)=0zcc4h			;EISA bus definition
	INITVAL = 0000XXXX

GROUP = "SCSI Host Adapter"				
	TYPE="MSD"

FUNCTION = "AT/EISA Mode Port Address"

	CHOICE="AT Mode Port 330H"
		LINK
		PORT = 330H-333H
		SHARE=NO
		SIZE=BYTE
		INIT=IOPORT(1) LOC (7 6 2 1 0) 00110B 

	CHOICE="AT Mode Port 230H"
		LINK
		PORT = 230H-233H
		SHARE=NO
		SIZE=BYTE
		INIT=IOPORT(1) LOC (7 6 2 1 0) 00100B 
 
	CHOICE="AT Mode Port 130H"
		LINK
		PORT = 130H-133H 
		SHARE=NO
		SIZE=BYTE
		INIT=IOPORT(1) LOC (7 6 2 1 0) 00010B 

	CHOICE="AT Mode Port 334H"
		LINK
		PORT = 334H-337H
		SHARE=NO
		SIZE=BYTE
		INIT=IOPORT(1) LOC (7 6 2 1 0) 00111B 

	CHOICE="AT Mode Port 234H"
		LINK
		PORT = 234H-237H
		SHARE=NO
		SIZE=BYTE
		INIT=IOPORT(1) LOC (7 6 2 1 0) 00101B 

	CHOICE="AT Mode Port 134H"
		LINK
		PORT = 134H-137H
		SHARE=NO
		SIZE=BYTE
		INIT=IOPORT(1) LOC (7 6 2 1 0) 00011B 

	CHOICE="EISA Mode"
		LINK
		INIT=IOPORT(1) LOC (7 6 2 1 0) 10000B		

FUNCTION = "BIOS Address"

	CHOICE="BIOS Enabled"
		COMBINE
			MEMORY=16K
			ADDRESS=0CC000H-0EC000H STEP=16K
			WRITABLE=NO
			MEMTYPE = OTH
			SHARE=NO
			SIZE=BYTE
			CACHE=YES
			DECODE=32

	INIT=IOPORT(2) LOC(3 2 1 0) 0011B - 1011B


	
FUNCTION = "Interrupt Channel"

	CHOICE="AT Mode"
		LINK
		IRQ=11|9|10|12|14|15
		SHARE = NO
		TRIGGER = EDGE
		INIT=IOPORT(3) LOC(4 3 2 1 0) 11010B | 11000B | 11001B | 11011B | 11101B | 11110B

	CHOICE="EISA Mode"
		LINK
		IRQ=11|9|10|12|14|15
		SHARE = YES
		TRIGGER = LEVEL
		INIT=IOPORT(3) LOC(4 3 2 1 0) 10010B | 10000B | 10001B | 10011B | 10101B | 10110B



FUNCTION = "SCSI DEFINITION"

     SUBFUNCTION="Adapter SCSI Id"

	CHOICE="Device Id 7"
		LINK
		INIT=IOPORT(4) LOC(3 2 1 0) 0111B
	CHOICE="Device Id 6"
		LINK
		INIT=IOPORT(4) LOC(3 2 1 0) 0110B
	CHOICE="Device Id 5"
		LINK
		INIT=IOPORT(4) LOC(3 2 1 0) 0101B
	CHOICE="Device Id 4"
		LINK
		INIT=IOPORT(4) LOC(3 2 1 0) 0100B
	CHOICE="Device Id 3"
		LINK
		INIT=IOPORT(4) LOC(3 2 1 0) 0011B
	CHOICE="Device Id 2"
		LINK
		INIT=IOPORT(4) LOC(3 2 1 0) 0010B
	CHOICE="Device Id 1"
		LINK
		INIT=IOPORT(4) LOC(3 2 1 0) 0001B
	CHOICE="Device Id 0"
		LINK
		INIT=IOPORT(4) LOC(3 2 1 0) 0000B

     SUBFUNCTION="SCSI RESET AT POWER ON"

	CHOICE="POWER ON RESET"
		LINK
		INIT=IOPORT(4) LOC(4) 1B

	CHOICE="NO POWER ON RESET"
		LINK
		INIT=IOPORT(4) LOC (4) 0B

FUNCTION="EISA Bus Definition"

     SUBFUNCTION="AT Mode DMA Channel Return"

	CHOICE="Channel 5"
		LINK
		INIT=IOPORT(5) LOC(3 2) 01B

	CHOICE="Channel 6"
		LINK
		INIT=IOPORT(5) LOC(3 2) 10B

	CHOICE="Channel 7"
		LINK
		INIT=IOPORT(5) LOC(3 2) 11B

 	CHOICE="Channel 0"
		LINK
		INIT=IOPORT(5) LOC(3 2) 00B


    SUBFUNCTION="Bus on Time"

	CHOICE="4 uSEC"
		LINK
		INIT=IOPORT(5) LOC(1 0) 01B


ENDGROUP


